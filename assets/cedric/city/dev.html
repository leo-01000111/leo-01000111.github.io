<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ville de Cédric (dev)</title>
<style>
  body { margin: 0; background: #0a0c13; color: #f1e6dc; font: 12px/1.4 monospace; }
  #bar { position: fixed; left: 8px; bottom: 8px; z-index: 10000; display: flex; gap: 8px; align-items: flex-start; }
  #dbg { margin: 0; white-space: pre; pointer-events: none; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<!-- Dev harness. Query: time=golden|sunset|blue|night  run=1  season=autumn|winter|spring|summer
     weather=leaves|mist|clear|snow|stars|petals|shower|rain|fireflies  cam=0..1  quality=high|medium|low
     mode=bench  pos=x,z  hdg=degrees  cover=0  name=0 (no name popup)  -->
<div id="bar">
  <button id="open" type="button">Ouvrir</button>
  <button id="close" type="button">Fermer</button>
  <pre id="dbg"></pre>
</div>
<script src="../design.js"></script>
<script type="module">
  import { open, close } from "./main.js";
  import { T } from "./text.js";
  const params = new URLSearchParams(location.search);
  const dbg = document.getElementById("dbg");
  const launch = () => open({ dev: true, params });
  document.getElementById("open").onclick = launch;
  document.getElementById("close").onclick = () => close();
  setInterval(() => {
    const g = window.__city;
    if (!g) { dbg.textContent = ""; return; }
    const w = g.env.weather.state, p = g.player.state.pos;
    dbg.textContent =
      `${T.dev.fps}: ${g.stats.fps.toFixed(0)}  (${g.stats.calls} appels, ${(g.stats.tris / 1000).toFixed(0)}k triangles)\n` +
      `${T.dev.phase}: ${T.phases[g.env.time.label]} (${g.env.time.phase.toFixed(2)})\n` +
      `${T.dev.weather}: ${T.seasons[w.season]} / ${T.weather[w.kind]}\n` +
      `${T.dev.quality}: ${T.quality[g.quality]}\n` +
      `${T.dev.pos}: ${p.x.toFixed(1)}, ${p.z.toFixed(1)}  ${T.dev.near}: ${g.player.state.near ? g.player.state.near.id : "-"}`;
  }, 500);
  launch();
</script>
</body>
</html>
