<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135">
  <rect width="240" height="135" fill="#f5f5f2"/>

  <!-- Input box -->
  <rect x="12" y="48" width="48" height="38" fill="rgba(75,79,85,0.07)" stroke="rgba(75,79,85,0.35)" stroke-width="1"/>
  <text x="36" y="62" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6.5" fill="rgba(75,79,85,0.55)" letter-spacing="0.12em">INPUT</text>
  <text x="36" y="79" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#121314">7+3</text>

  <!-- Arrow right to NN -->
  <line x1="62" y1="67" x2="77" y2="67" stroke="rgba(75,79,85,0.5)" stroke-width="1.5"/>
  <polygon points="77,67 73,64 73,70" fill="rgba(75,79,85,0.5)"/>

  <!-- Connections layer 1→2 -->
  <line x1="88" y1="50" x2="122" y2="57" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="50" x2="122" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="50" x2="122" y2="77" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="67" x2="122" y2="57" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="67" x2="122" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="67" x2="122" y2="77" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="84" x2="122" y2="57" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="84" x2="122" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="88" y1="84" x2="122" y2="77" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>

  <!-- Layer 1 nodes -->
  <circle cx="88" cy="50" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>
  <circle cx="88" cy="67" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>
  <circle cx="88" cy="84" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>

  <!-- Connections layer 2→3 -->
  <line x1="127" y1="57" x2="155" y2="50" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="57" x2="155" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="57" x2="155" y2="84" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="67" x2="155" y2="50" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="67" x2="155" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="67" x2="155" y2="84" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="77" x2="155" y2="50" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="77" x2="155" y2="67" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>
  <line x1="127" y1="77" x2="155" y2="84" stroke="rgba(75,79,85,0.12)" stroke-width="0.7"/>

  <!-- Layer 2 nodes (hidden – brighter) -->
  <circle cx="122" cy="57" r="6" fill="rgba(75,79,85,0.18)" stroke="#f5c518" stroke-width="1.3"/>
  <circle cx="122" cy="67" r="6.5" fill="rgba(75,79,85,0.28)" stroke="#f5c518" stroke-width="1.6"/>
  <circle cx="122" cy="77" r="6" fill="rgba(75,79,85,0.18)" stroke="#f5c518" stroke-width="1.3"/>

  <!-- Layer 3 nodes -->
  <circle cx="160" cy="50" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>
  <circle cx="160" cy="67" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>
  <circle cx="160" cy="84" r="5.5" fill="#f5f5f2" stroke="#f5c518" stroke-width="1"/>

  <!-- Arrow right to output -->
  <line x1="166" y1="67" x2="179" y2="67" stroke="rgba(75,79,85,0.5)" stroke-width="1.5"/>
  <polygon points="179,67 175,64 175,70" fill="rgba(75,79,85,0.5)"/>

  <!-- Output box -->
  <rect x="181" y="48" width="48" height="38" fill="rgba(75,79,85,0.12)" stroke="rgba(75,79,85,0.6)" stroke-width="1"/>
  <text x="205" y="62" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6.5" fill="rgba(75,79,85,0.6)" letter-spacing="0.12em">OUTPUT</text>
  <text x="205" y="79" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#121314">10</text>

  <!-- Bottom label row -->
  <text x="120" y="107" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="rgba(18,19,20,0.28)" letter-spacing="0.1em">TRANSFORMER · SEQ2SEQ · GRU</text>

  <!-- Accuracy badge -->
  <rect x="12" y="112" width="76" height="14" fill="rgba(75,79,85,0.1)" stroke="rgba(75,79,85,0.22)" stroke-width="0.8"/>
  <text x="50" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.5" fill="#121314" letter-spacing="0.06em">TRANSFORMER 96.66 %</text>

  <!-- Grokking badge -->
  <rect x="182" y="112" width="48" height="14" fill="rgba(75,79,85,0.07)" stroke="rgba(75,79,85,0.2)" stroke-width="0.8"/>
  <text x="206" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="rgba(75,79,85,0.6)" letter-spacing="0.1em">GROKKING</text>

  <!-- Title -->
  <text x="120" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="600" fill="rgba(18,19,20,0.42)" letter-spacing="0.16em">AICALC</text>
</svg>
